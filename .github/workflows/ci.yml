name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce?schema=public
      ACCESS_TOKEN_SECRET: ci-dummy-secret-not-for-production
      JOBS_IN_API: '0'
      AUTO_EMBED_PRODUCTS: '0'
      AUTO_SETUP_SIMILARITY: '0'
      RATE_LIMIT_ENABLED: '0'
      PORT: '3000'
      # Chi cho test: lo ma OTP trong response va cho seller gia lap van don.
      OTP_EXPOSE_DEV_CODE: '1'
      SHIPMENT_SIMULATE_ENABLED: '1'
      SHIPPING_WEBHOOK_SECRET_MOCK: ci-webhook-secret
      # Khoa sandbox cong khai cua MoMo (tai lieu MoMo), khong phai bi mat.
      MOMO_PARTNER_CODE: MOMO
      MOMO_ACCESS_KEY: F8BBA842ECF85
      MOMO_SECRET_KEY: K951B6PE1waDMi640xX08PD3vg6EkVlz
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Start server
        run: |
          npm run seed
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            nc -z localhost 3000 && exit 0
            sleep 1
          done
          cat server.log; exit 1
      # Test MoMo sandbox goi mang ngoai, co the fail do dich vu ben thu ba.
      - run: npm test
      - if: failure()
        run: cat server.log

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
