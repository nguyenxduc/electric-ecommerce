server {
  listen 8080;
  root /usr/share/nginx/html;

  # File build co hash trong ten: cache lau.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: route khong phai file thi tra index.html, khong cache de ban moi len ngay.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
