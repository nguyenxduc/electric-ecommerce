server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Header bao mat cho SPA (helmet chi phu /api). Dat o muc server va trong location
  # chi dung `expires` (khong add_header) de cac header nay duoc ke thua.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # File build co hash trong ten: cache lau.
  location /assets/ {
    expires 1y;
  }

  # SPA: route khong phai file thi tra index.html, khong cache de ban moi len ngay.
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
  }
}
